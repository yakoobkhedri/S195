<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>ناحیه کاربری</title>

  <link rel="stylesheet" href="css/bootstrap.min.css" />
  <link rel="stylesheet" href="css/styles.css" />

</head>

<body>

  <section>
    <div class="d-flex gap-40 m-4 me-0">
      <!-- sidebar -->
       <aside class="w-269 flex-shrink-0 bg-white rounded-l-24 py-40 px-4">
        <div>
          <a class="d-block"><img alt="logo" src="images/logo.png" class="img-fluid"></a>
          <div class="mt-4">
            <ul class="list-unstyled m-0 p-0">
              <li class="fw-Medium mb-2">
                <a class="rounded-12 d-flex align-items-center py-10 px-2 gap-2 text-main bg-main-2 hover2">
                  <svg class="flex-shrink-0" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                   <path d="M12 18V15" stroke="#2658A8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                   <path d="M10.0693 2.81985L3.13929 8.36985C2.35929 8.98985 1.85929 10.2998 2.02929 11.2798L3.35929 19.2398C3.59929 20.6598 4.95929 21.8098 6.39929 21.8098H17.5993C19.0293 21.8098 20.3993 20.6498 20.6393 19.2398L21.9693 11.2798C22.1293 10.2998 21.6293 8.98985 20.8593 8.36985L13.9293 2.82985C12.8593 1.96985 11.1293 1.96985 10.0693 2.81985Z" stroke="#2658A8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                  <span>خانه</span>
                </a>
              </li>
              <li class="fw-Medium mb-2">
                <div class="accordion-btn rounded-12 d-flex align-items-center py-10 pe-2 ps-3 gap-2 text-main bg-main-2 hover2">
                 <svg class="flex-shrink-0" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                   <path d="M10 6H14C16 6 16 5 16 4C16 2 15 2 14 2H10C9 2 8 2 8 4C8 6 9 6 10 6Z" stroke="#2658A8" stroke-width="1.5" stroke-miterlimit="10" stroke-linecap="round" stroke-linejoin="round"/>
                   <path d="M16 4.02002C19.33 4.20002 21 5.43002 21 10V16C21 20 20 22 15 22H9C4 22 3 20 3 16V10C3 5.44002 4.67 4.20002 8 4.02002" stroke="#2658A8" stroke-width="1.5" stroke-miterlimit="10" stroke-linecap="round" stroke-linejoin="round"/>
                 </svg>
                 <span>صفحات</span>
                 <svg class="flex-shrink-0 me-auto" width="8" height="5" viewBox="0 0 8 5" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M0.355469 0.353516L3.85547 3.85352L7.35547 0.353516" stroke="#2658A8" stroke-linejoin="round"/>
                 </svg>
                </div>
                <ul class="accordion-content list-unstyled m-0 px-3 fs-14">
                  <li>
                    <a class="d-block text-dark hover3 py-2">صفحه اول</a>
                  </li>
                   <li>
                    <a class="d-block text-dark hover3 py-2">صفحه دوم</a>
                  </li>
                   <li>
                    <a class="d-block text-dark hover3 py-2">صفحه سوم</a>
                  </li>
                </ul>
              </li>
              <li class="fw-Medium">
                <div class="accordion-btn rounded-12 d-flex align-items-center py-10 pe-2 ps-3 gap-2 text-main bg-main-2 hover2">
                 <svg class="flex-shrink-0" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M22 11V17C22 21 21 22 17 22H7C3 22 2 21 2 17V7C2 3 3 2 7 2H8.5C10 2 10.33 2.44 10.9 3.2L12.4 5.2C12.78 5.7 13 6 14 6H17C21 6 22 7 22 11Z" stroke="#2658A8" stroke-width="1.5" stroke-miterlimit="10"/>
                  <path d="M8 2H17C19 2 20 3 20 5V6.38" stroke="#2658A8" stroke-width="1.5" stroke-miterlimit="10" stroke-linecap="round" stroke-linejoin="round"/>
                 </svg>
                 <span>گزارش‌های سامانه</span>
                 <svg class="flex-shrink-0 me-auto" width="8" height="5" viewBox="0 0 8 5" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M0.355469 0.353516L3.85547 3.85352L7.35547 0.353516" stroke="#2658A8" stroke-linejoin="round"/>
                 </svg>
                </div>
                <ul class="accordion-content list-unstyled m-0 px-3 fs-14">
                  <li>
                    <a class="d-block text-dark hover3 py-2">گزارش اول</a>
                  </li>
                   <li>
                    <a class="d-block text-dark hover3 py-2">گزارش دوم</a>
                  </li>
                   <li>
                    <a class="d-block text-dark hover3 py-2">گزارش سوم</a>
                  </li>
                </ul>
              </li>
            </ul>
          </div>
        </div>
       </aside>
    </div>
  </section>

  <script src="js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
</body>

</html>
